name: Ensaiar recuperação do Liquibase em homologação
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operação no banco descartável scrapbook_recovery
        required: true
        type: choice
        options:
          - preview-empty-base
          - rollback-empty-base

permissions:
  contents: read

concurrency:
  group: publish-hlg
  cancel-in-progress: false

jobs:
  recovery:
    if: ${{ github.ref == 'refs/heads/hlg' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: hlg
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ''
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      RECOVERY_OPERATION: ${{ inputs.operation }}
      RECOVERY_CLUSTER: ${{ vars.RECOVERY_CLUSTER }}
      RECOVERY_TASK_DEFINITION: ${{ vars.RECOVERY_TASK_DEFINITION }}
      RECOVERY_RDS_IDENTIFIER: ${{ vars.RECOVERY_RDS_IDENTIFIER }}
      RECOVERY_SUBNET_IDS: ${{ vars.RECOVERY_SUBNET_IDS }}
      RECOVERY_GROUP_ID: ${{ vars.RECOVERY_GROUP_ID }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Iniciar evidência
        id: start
        run: |
          source .github/scripts/recovery_support.sh
          start_recovery_evidence
      - name: Assumir identidade de ensaio por OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_RECOVERY_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
          role-session-name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Conferir alvo e executar tarefa descartável
        run: bash .github/scripts/recover_migration.sh
      - name: Registrar resultado
        if: ${{ always() && steps.start.outcome == 'success' }}
        env:
          RECOVERY_RESULT: ${{ job.status }}
        run: |
          source .github/scripts/release_support.sh
          record result "$RECOVERY_RESULT"
          record finishedAt "$(date -u +%FT%TZ)"
      - name: Guardar evidência
        if: ${{ always() && steps.start.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
