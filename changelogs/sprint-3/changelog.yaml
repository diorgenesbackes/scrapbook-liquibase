databaseChangeLog:
  - changeSet:
      id: f08-story-002-photo-receipts
      author: scrapbook
      dbms: postgresql
      runInTransaction: true
      changes:
        - sqlFile:
            path: sql/001-photo-receipts.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
      rollback:
        - sqlFile:
            path: rollback/001-photo-receipts.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: false
