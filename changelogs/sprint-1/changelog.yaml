databaseChangeLog:
  - changeSet:
      id: f01-story-001-base
      author: scrapbook
      dbms: postgresql
      runInTransaction: true
      changes:
        - sqlFile:
            path: sql/001-contas.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
        - sqlFile:
            path: sql/002-eventos.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
        - sqlFile:
            path: sql/003-registros.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
        - sqlFile:
            path: sql/004-notificacoes-e-operacao.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
        - sqlFile:
            path: sql/005-relacionamentos.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
        - sqlFile:
            path: sql/006-permissoes.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
        - sqlFile:
            path: sql/007-assinatura-do-catalogo.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: false
      rollback:
        - sqlFile:
            path: rollback/001-remover-base-inicial.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: false
