databaseChangeLog:
  - changeSet:
      id: f03-story-001-event-creation
      author: scrapbook
      dbms: postgresql
      runInTransaction: true
      changes:
        - sqlFile:
            path: sql/001-event-creation.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
      rollback:
        - sqlFile:
            path: rollback/001-event-creation.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: false
