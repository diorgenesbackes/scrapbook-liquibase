databaseChangeLog:
  - changeSet:
      id: f10-story-001-media-preparation
      author: scrapbook
      dbms: postgresql
      runInTransaction: true
      changes:
        - sqlFile:
            path: sql/001-media-preparation.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
      rollback:
        - sqlFile:
            path: rollback/001-media-preparation.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: false
